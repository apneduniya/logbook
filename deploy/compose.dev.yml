name: logbook-dev
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: logbook
      POSTGRES_DB: logbook
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - logbook-pg:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  logbook-pg:
