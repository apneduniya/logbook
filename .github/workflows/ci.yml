name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgres://logbook:logbook@127.0.0.1:54329/logbook?sslmode=disable
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: logbook
          POSTGRES_PASSWORD: logbook
          POSTGRES_DB: logbook
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U logbook" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.30.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - run: goose -dir migrations postgres "$DATABASE_URL" up
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: govulncheck ./...
  agent:
    # The agent has no Postgres dependency; its OS-specific code (registry,
    # launchd, systemd, file semantics) is tested on each OS here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./internal/agent/... ./pkg/... ./cmd/logbook/...
      - name: Test
        run: go test -count=1 ./internal/agent/... ./pkg/... ./cmd/logbook/...
      - name: Test with the race detector
        # -race needs cgo, which the agent itself never uses (ADR 0009).
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./internal/agent/... ./pkg/... ./cmd/logbook/...
      - name: Cross-compile every release target
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "building $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/logbook
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./internal/agent/... ./cmd/logbook/...
          done
      - name: Shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck -s sh scripts/install.sh
      - name: Parse install.ps1 with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host "install.ps1 parses under PowerShell $($PSVersionTable.PSVersion)"
